name: macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Require Apple Silicon runner
        run: |
          architecture="$(uname -m)"
          test "$architecture" = "arm64" || {
            echo "Expected an Apple Silicon arm64 runner, got: $architecture" >&2
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Sync versions
        run: pnpm --dir app sync-version
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Test frontend
        run: pnpm --dir app test --run
      - name: Build frontend
        run: pnpm --dir app build
      - name: Test Edge extension
        working-directory: browser-extension
        run: node --test tests/*.test.mjs
      - name: Build Edge extension
        working-directory: browser-extension
        run: node build.mjs
      - name: Prepare macOS bundle resources
        run: node scripts/prepare-edge-bundle.mjs
      - name: Check generated-file drift
        run: git diff --check && git diff --exit-code
