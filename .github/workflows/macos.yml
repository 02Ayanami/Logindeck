name: macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Apple Silicon runner
        run: |
          architecture="$(uname -m)"
          test "$architecture" = "arm64" || {
            echo "Expected an Apple Silicon arm64 runner, got: $architecture" >&2
            exit 1
          }

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-21
        with:
          toolchain: 1.89.0
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Sync versions
        run: pnpm --dir app sync-version
      - name: Prepare macOS bundle resources
        run: node scripts/prepare-edge-bundle.mjs
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test shared Rust core
        run: cargo test -p autologin-core --locked
      - name: Test macOS platform
        run: cargo test -p platform-macos --locked
      - name: Test reviewed Windows portable boundary
        run: cargo test -p platform-windows --locked
      - name: Test platform selection
        run: cargo test -p platform-runtime --locked
      - name: Test native messaging host
        run: cargo test -p autologin-native-host --locked
      - name: Test desktop commands
        run: cargo test -p autologin-desktop --locked
      - name: Test frontend
        run: pnpm --dir app test --run
      - name: Build frontend
        run: pnpm --dir app build
      - name: Test Edge extension
        working-directory: browser-extension
        run: node --test tests/*.test.mjs
      - name: Build Edge extension
        working-directory: browser-extension
        run: node build.mjs
      - name: Check generated-file drift
        run: git diff --check && git diff --exit-code
