name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing-style release tag to build (for example v0.1.1)
        required: true
        default: v0.1.1
      publish:
        description: Publish a GitHub Release after both builds succeed
        required: true
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - id: version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

  windows:
    needs: prepare
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-21
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app tauri build --bundles nsis
      - name: Collect the Windows x64 installer
        run: node scripts/collect-release-assets.mjs windows "${{ needs.prepare.outputs.version }}" target/release/bundle/nsis release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: release-assets/LoginDeck-*-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-21
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app tauri build --bundles dmg
      - name: Collect the Apple Silicon installer
        run: node scripts/collect-release-assets.mjs macos "${{ needs.prepare.outputs.version }}" target/release/bundle/dmg release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-installer
          path: release-assets/LoginDeck-*-macos-arm64.dmg
          if-no-files-found: error

  release:
    needs: [prepare, windows, macos]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-installer"
          path: release-assets
          merge-multiple: true
      - name: Verify the complete release set
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) | wc -l)" -eq 2
          test -f "LoginDeck-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe"
          test -f "LoginDeck-${{ needs.prepare.outputs.version }}-macos-arm64.dmg"
          sha256sum LoginDeck-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cat > release-notes.md <<'NOTES'
          LoginDeck is an open-source learning project, not an audited password manager.

          These installers are unsigned. Windows may show a SmartScreen warning and macOS may require an explicit open from Privacy & Security. The Windows package supports x64; the macOS package supports Apple Silicon only. Edge extension loading remains a manual user action described by the in-app installation guide.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* --title "LoginDeck $RELEASE_TAG" --notes-file release-notes.md --verify-tag
