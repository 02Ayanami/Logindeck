name: Windows foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # Keep native credential, clipboard, catalog and controlled Win32 launch checks enabled.
      # An unavailable runner session must fail visibly, not become a silent test exclusion.
      - name: Verify Windows foundation
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-windows.ps1
