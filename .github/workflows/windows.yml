name: Windows foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
        working-directory: LoginDeck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare pinned package manager
        id: pnpm
        run: |
          npm install --global corepack@0.35.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@11.19.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $store = corepack pnpm@11.19.0 --dir app store path --silent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "store=$store" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: windows-pnpm-11.19.0-${{ hashFiles('LoginDeck/app/pnpm-lock.yaml') }}
          restore-keys: windows-pnpm-11.19.0-

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LoginDeck -> target

      # Keep native credential, clipboard, catalog and controlled Win32 launch checks enabled.
      # An unavailable runner session must fail visibly, not become a silent test exclusion.
      - name: Verify Windows foundation
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-windows.ps1
